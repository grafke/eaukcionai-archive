<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eaukcionai archyvas</title>
<meta name="description" content="Varžytynių ir aukcionų iš eaukcionai.lt archyvas: paieška ir filtrai po turto objektus.">
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbfa;
    --surface: #ffffff;
    --text: #1d1d1b;
    --muted: #64645f;
    --border: #e2e1dc;
    --accent: #0f5fc4;
    --live: #16794a;
    --live-bg: #e3f4ea;
    --ended: #77766f;
    --ended-bg: #efeeea;
    --row-hover: #f3f2ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514;
      --surface: #1d1d1b;
      --text: #ecebe6;
      --muted: #a09f98;
      --border: #34332f;
      --accent: #78b0ff;
      --live: #6fd39f;
      --live-bg: #19352a;
      --ended: #a09f98;
      --ended-bg: #2a2926;
      --row-hover: #252522;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .page { max-width: 1400px; margin: 0 auto; padding: 20px 16px 48px; }
  header h1 { margin: 0; font-size: 22px; letter-spacing: -0.01em; }
  header p { margin: 4px 0 0; color: var(--muted); }
  a { color: var(--accent); }
  form {
    display: grid;
    gap: 10px;
    margin: 18px 0 12px;
    padding: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px 12px; margin-top: 10px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .pair { display: flex; gap: 6px; }
  .pair input { min-width: 0; flex: 1; }
  input, select, button {
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    min-height: 34px;
  }
  button { cursor: pointer; align-self: end; }
  input:focus-visible, select:focus-visible, button:focus-visible, th button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .summary { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); margin: 0 0 8px; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
  th button { all: unset; cursor: pointer; }
  th[aria-sort="ascending"] button::after { content: " ▲"; }
  th[aria-sort="descending"] button::after { content: " ▼"; }
  tbody tr:hover { background: var(--row-hover); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.date { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .status { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: var(--ended-bg); color: var(--ended); white-space: nowrap; }
  .status.live { background: var(--live-bg); color: var(--live); }
  .sub { display: block; color: var(--muted); font-size: 12px; }
  .phone-only { display: none; }
  .empty, .error { padding: 32px 16px; text-align: center; color: var(--muted); }
  @media (max-width: 760px) {
    .phone-only { display: flex; }
    table, tbody, tr, td { display: block; border: 0; }
    table { background: transparent; }
    thead { display: none; }
    tbody tr {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 10px;
      padding: 6px 0;
    }
    td { display: flex; justify-content: space-between; gap: 12px; padding: 3px 12px; border: 0; text-align: right; }
    td.num { text-align: right; }
    td::before { content: attr(data-label); color: var(--muted); font-size: 12px; text-align: left; flex: none; }
    td.title { display: block; text-align: left; font-weight: 600; padding-top: 6px; }
    td.title::before { content: none; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>eaukcionai archyvas</h1>
    <p>Varžytynės ir aukcionai iš <a href="https://www.eaukcionai.lt">eaukcionai.lt</a>, išsaugoti ir pasibaigus. Viena eilutė yra vienas parduodamas objektas.</p>
  </header>

  <form id="filters" autocomplete="off">
    <label>Paieška pagal pavadinimą ar adresą
      <input type="search" name="q" placeholder="pvz. butas Šiauliai">
    </label>
    <details id="more" open>
    <summary>Filtrai</summary>
    <div class="grid">
    <label>Aukciono rūšis <select name="kind"></select></label>
    <label>Turto potipis <select name="subtype"></select></label>
    <label>Savivaldybė <select name="municipality"></select></label>
    <label>Vietovė <select name="settlement"></select></label>
    <label>Paskirtis <select name="paskirtis"></select></label>
    <label>Būsena <select name="status"></select></label>
    <label>Pradinė kaina, Eur
      <span class="pair"><input type="number" name="price_min" min="0" placeholder="nuo" inputmode="numeric"><input type="number" name="price_max" min="0" placeholder="iki" inputmode="numeric"></span>
    </label>
    <label>Pabaiga nuo <input type="date" name="end_from"></label>
    <label>Pabaiga iki <input type="date" name="end_to"></label>
    <label class="phone-only">Rikiuoti <select id="sort"></select></label>
    <button type="button" id="reset">Numatytieji filtrai</button>
    </div>
    </details>
  </form>

  <p class="summary"><span id="count">Kraunama…</span><span id="updated"></span></p>
  <div id="results"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.14.2/sql-wasm.min.js" integrity="sha512-3rCfIirhW2xUpZCwDHnpKT5qyOvlt6hsu0Sq1IjP5hW9/k5YWnsLJ/7bF9KTmUgjDSQmvJw40mQDFbrxr647Ag==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
"use strict";
const SQL_JS_DIR = "https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.14.2/";
const LIVE_STATUSES = new Set(["Paskelbtas", "Paskelbtos", "Vykstančios", "Vykstantis"]);
const MAX_ROWS = 500;
const DEFAULT_WINDOW_DAYS = 90;

const COLUMNS = [
  { key: "name", label: "Turtas", sql: "name" },
  { key: "municipality", label: "Savivaldybė", sql: "municipality" },
  { key: "settlement", label: "Vietovė", sql: "settlement" },
  { key: "subtype", label: "Potipis", sql: "subtype" },
  { key: "paskirtis", label: "Paskirtis", sql: "paskirtis" },
  { key: "kind", label: "Rūšis", sql: "kind" },
  { key: "status", label: "Būsena", sql: "status" },
  { key: "starting_price_eur", label: "Pradinė kaina", sql: "starting_price_eur", format: "number" },
  { key: "highest_bid_eur", label: "Didžiausia kaina", sql: "highest_bid_eur", format: "number" },
  { key: "area_m2", label: "Plotas, m²", sql: "area_m2", format: "number" },
  { key: "price_per_m2", label: "Eur/m²", sql: "price_per_m2", format: "perM2" },
  { key: "first_seen", label: "Paskelbta", sql: "first_seen", format: "date" },
  { key: "end_date", label: "Pabaiga", sql: "end_date", format: "date" },
];
const SELECTS = ["kind", "subtype", "municipality", "settlement", "paskirtis", "status"];

const form = document.getElementById("filters");
const results = document.getElementById("results");
const countEl = document.getElementById("count");
const sortSelect = document.getElementById("sort");
let db;
let sort = { key: "end_date", dir: "desc" };

const fold = (s) => (s ?? "").normalize("NFD").replace(/\p{M}/gu, "").toLocaleLowerCase("lt");
const eur = new Intl.NumberFormat("lt-LT", { maximumFractionDigits: 2 });
const perM2Small = new Intl.NumberFormat("lt-LT", { maximumSignificantDigits: 2 });
const FORMATS = {
  text: { text: (v) => v, firstDir: "asc", sqlOrder: false },
  number: { text: (v) => eur.format(v), className: "num", firstDir: "desc", sqlOrder: true },
  perM2: { text: (v) => formatPerM2(v), className: "num", firstDir: "desc", sqlOrder: true },
  date: { text: (v) => v.replace("T", " ").slice(0, 16), className: "date", firstDir: "desc", sqlOrder: true },
};
const formatOf = (column) => FORMATS[column.format ?? "text"];
for (const column of COLUMNS) {
  if (column.format && !FORMATS[column.format]) throw new Error(`unknown format ${column.format} on ${column.key}`);
}
const isoDate = (d) => d.toISOString().slice(0, 10);
const ITEM_WORD = { one: "objektas", few: "objektai" };
const plural = new Intl.PluralRules("lt");
const items = (n) => `${n} ${ITEM_WORD[plural.select(n)] ?? "objektų"}`;

function defaults() {
  const from = new Date();
  from.setDate(from.getDate() - DEFAULT_WINDOW_DAYS);
  return { end_from: isoDate(from) };
}

function readForm() {
  const values = Object.fromEntries(new FormData(form));
  for (const k of Object.keys(values)) if (values[k] === "") delete values[k];
  return values;
}

function writeForm(values) {
  for (const el of form.elements) if (el.name) el.value = values[el.name] ?? "";
}

function query(sqlText, params = []) {
  const stmt = db.prepare(sqlText);
  stmt.bind(params);
  const rows = [];
  while (stmt.step()) rows.push(stmt.getAsObject());
  stmt.free();
  return rows;
}

function fillSelects() {
  for (const name of SELECTS) {
    const select = form.elements[name];
    const values = query(`SELECT DISTINCT ${name} AS v FROM item_rows WHERE ${name} IS NOT NULL`).map((r) => r.v);
    values.sort((a, b) => String(a).localeCompare(String(b), "lt"));
    select.replaceChildren(new Option("Visos", ""), ...values.map((v) => new Option(v, v)));
  }
}

function buildWhere(f) {
  const where = [];
  const params = [];
  if (f.q) {
    for (const word of fold(f.q).split(/\s+/).filter(Boolean)) {
      where.push("fold(name || ' ' || coalesce(address, '')) LIKE ?");
      params.push(`%${word}%`);
    }
  }
  for (const name of SELECTS) if (f[name]) { where.push(`${name} = ?`); params.push(f[name]); }
  if (f.price_min) { where.push("starting_price_eur >= ?"); params.push(Number(f.price_min)); }
  if (f.price_max) { where.push("starting_price_eur <= ?"); params.push(Number(f.price_max)); }
  if (f.end_from) { where.push("end_date >= ?"); params.push(f.end_from); }
  if (f.end_to) { where.push("end_date < ?"); params.push(`${f.end_to}T24`); }
  return { sql: where.length ? `WHERE ${where.join(" AND ")}` : "", params };
}

function formatPerM2(value) {
  if (value == null) return null;
  if (value !== 0 && Math.abs(value) < 0.005) return perM2Small.format(value);
  return eur.format(value);
}

function cell(tr, column, content, className) {
  const td = document.createElement("td");
  td.dataset.label = column.label;
  if (className) td.className = className;
  if (content instanceof Node) td.append(content); else td.textContent = content ?? "–";
  tr.append(td);
}

function renderRow(row) {
  const tr = document.createElement("tr");
  const title = document.createElement("span");
  const link = document.createElement("a");
  link.href = row.url;
  link.target = "_blank";
  link.rel = "noopener";
  link.textContent = row.name;
  const address = document.createElement("span");
  address.className = "sub";
  address.textContent = [row.address, row.number ? `Nr. ${row.number}` : null].filter(Boolean).join(" · ");
  title.append(link, address);
  const status = document.createElement("span");
  status.className = LIVE_STATUSES.has(row.status) ? "status live" : "status";
  status.textContent = row.status;
  for (const column of COLUMNS) {
    const value = row[column.key];
    if (column.key === "name") cell(tr, column, title, "title");
    else if (column.key === "status") cell(tr, column, status);
    else {
      const format = formatOf(column);
      cell(tr, column, value == null ? null : format.text(value), format.className);
    }
  }
  return tr;
}

function renderHead() {
  const tr = document.createElement("tr");
  for (const column of COLUMNS) {
    const th = document.createElement("th");
    th.scope = "col";
    if (sort.key === column.key) th.setAttribute("aria-sort", sort.dir === "asc" ? "ascending" : "descending");
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = column.label;
    button.addEventListener("click", () => {
      sort = sort.key === column.key
        ? { key: column.key, dir: sort.dir === "asc" ? "desc" : "asc" }
        : { key: column.key, dir: formatOf(column).firstDir };
      render();
    });
    th.append(button);
    tr.append(th);
  }
  const thead = document.createElement("thead");
  thead.append(tr);
  return thead;
}

function fillSortSelect() {
  sortSelect.replaceChildren(
    ...COLUMNS.flatMap((c) => [new Option(`${c.label} ↑`, `${c.key}.asc`), new Option(`${c.label} ↓`, `${c.key}.desc`)]),
  );
  sortSelect.addEventListener("change", (event) => {
    event.stopPropagation();
    const [key, dir] = sortSelect.value.split(".");
    sort = { key, dir };
    render();
  });
}

function compareRows(a, b, column, dir) {
  const av = a[column.key];
  const bv = b[column.key];
  if (av == null && bv == null) return 0;
  if (av == null) return 1;
  if (bv == null) return -1;
  const primary = formatOf(column).className === "num" ? av - bv : String(av).localeCompare(String(bv), "lt");
  return dir === "desc" ? -primary : primary;
}

function render() {
  sortSelect.value = `${sort.key}.${sort.dir}`;
  const f = readForm();
  history.replaceState(null, "", `#${new URLSearchParams({ ...f, sort: `${sort.key}.${sort.dir}` })}`);
  const { sql: where, params } = buildWhere(f);
  const total = query(`SELECT count(*) AS n FROM item_rows ${where}`, params)[0].n;
  const column = COLUMNS.find((c) => c.key === sort.key);
  // sql.js has no Lithuanian collation. Dates and numbers stay in SQL. Text sorts in the page.
  const sqlOrder = formatOf(column).sqlOrder;
  let rows = query(
    `SELECT * FROM item_rows ${where}`
      + (sqlOrder
        ? ` ORDER BY ${column.sql} IS NULL, ${column.sql} ${sort.dir === "asc" ? "ASC" : "DESC"}, auction_id, item_no LIMIT ${MAX_ROWS}`
        : ""),
    params,
  );
  if (!sqlOrder) {
    rows.sort((a, b) => compareRows(a, b, column, sort.dir) || a.auction_id - b.auction_id || a.item_no - b.item_no);
    rows = rows.slice(0, MAX_ROWS);
  }
  countEl.textContent = total > rows.length ? `Rodoma ${rows.length} iš ${total}` : items(total);
  if (!rows.length) {
    results.innerHTML = '<p class="empty">Nieko nerasta. Pabandykite plačiau nustatyti filtrus.</p>';
    return;
  }
  const table = document.createElement("table");
  const tbody = document.createElement("tbody");
  tbody.append(...rows.map(renderRow));
  table.append(renderHead(), tbody);
  results.replaceChildren(table);
}

function restoreFromHash() {
  const params = Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
  if (params.sort) {
    const [key, dir] = params.sort.split(".");
    if (COLUMNS.some((c) => c.key === key) && (dir === "asc" || dir === "desc")) sort = { key, dir };
    delete params.sort;
  }
  writeForm(Object.keys(params).length ? params : defaults());
}

async function main() {
  try {
    const [SQL, buffer] = await Promise.all([
      initSqlJs({ locateFile: (file) => SQL_JS_DIR + file }),
      fetch("auctions.sqlite").then((r) => {
        if (!r.ok) throw new Error(`auctions.sqlite: HTTP ${r.status}`);
        return r.arrayBuffer();
      }),
    ]);
    db = new SQL.Database(new Uint8Array(buffer));
    db.create_function("fold", fold);
    fillSelects();
    fillSortSelect();
    restoreFromHash();
    const latest = query("SELECT max(last_fetched) AS t FROM auctions")[0].t;
    if (latest) document.getElementById("updated").textContent = `Atnaujinta ${latest.replace("T", " ").replace("Z", " UTC")}`;
    render();
  } catch (error) {
    countEl.textContent = "";
    results.innerHTML = "";
    const p = document.createElement("p");
    p.className = "error";
    p.textContent = `Nepavyko įkelti duomenų: ${error.message}`;
    results.append(p);
  }
}

let debounce;
form.addEventListener("input", () => { clearTimeout(debounce); debounce = setTimeout(render, 150); });
document.getElementById("reset").addEventListener("click", () => { writeForm(defaults()); sort = { key: "end_date", dir: "desc" }; render(); });
if (matchMedia("(max-width: 760px)").matches) document.getElementById("more").open = false;
main();
</script>
</body>
</html>
