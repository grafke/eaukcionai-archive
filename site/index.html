<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eaukcionai archyvas</title>
<meta name="description" content="Varžytynių ir aukcionų iš eaukcionai.lt archyvas: paieška ir filtrai po turto objektus.">
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbfa;
    --surface: #ffffff;
    --text: #1d1d1b;
    --muted: #64645f;
    --border: #e2e1dc;
    --accent: #0f5fc4;
    --live: #16794a;
    --live-bg: #e3f4ea;
    --ended: #77766f;
    --ended-bg: #efeeea;
    --row-hover: #f3f2ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514;
      --surface: #1d1d1b;
      --text: #ecebe6;
      --muted: #a09f98;
      --border: #34332f;
      --accent: #78b0ff;
      --live: #6fd39f;
      --live-bg: #19352a;
      --ended: #a09f98;
      --ended-bg: #2a2926;
      --row-hover: #252522;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .page { max-width: 1400px; margin: 0 auto; padding: 20px 16px 48px; }
  header h1 { margin: 0; font-size: 22px; letter-spacing: -0.01em; }
  header p { margin: 4px 0 0; color: var(--muted); }
  a { color: var(--accent); }
  form {
    display: grid;
    gap: 10px;
    margin: 18px 0 12px;
    padding: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px 12px; margin-top: 10px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .pair { display: flex; gap: 6px; }
  .pair input { min-width: 0; flex: 1; }
  input, select, button {
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    min-height: 34px;
  }
  button { cursor: pointer; align-self: end; }
  input:focus-visible, select:focus-visible, button:focus-visible, th button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .summary { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; color: var(--muted); margin: 0 0 8px; font-size: 13px; }
  .summary-main { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
  .page-size { flex: none; flex-direction: row; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; }
  .page-size select { min-height: 30px; padding: 2px 6px; }
  .pager { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 0 0 8px; }
  .pager.bottom { margin: 10px 0 0; }
  .pager[hidden] { display: none; }
  .pager button { min-height: 30px; min-width: 32px; padding: 2px 8px; font-size: 13px; }
  .pager button[aria-current="page"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .pager button[aria-current="page"]:disabled { opacity: 1; cursor: default; }
  .pager button:disabled { opacity: 0.4; cursor: default; }
  #count { scroll-margin-top: 12px; }
  .pager .ellipsis { color: var(--muted); padding: 0 2px; user-select: none; }
  .views { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; }
  .views button[aria-selected="true"], .views button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .stats { display: grid; gap: 16px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  .card b { display: block; font-size: 18px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .card span, .note, .rounds { color: var(--muted); font-size: 12px; }
  .metric { cursor: help; text-decoration: underline dotted; text-underline-offset: 2px; }
  .tip {
    position: fixed;
    z-index: 5;
    max-width: 280px;
    padding: 6px 8px;
    background: var(--text);
    color: var(--bg);
    font-size: 12px;
    font-weight: 450;
    line-height: 1.35;
    border-radius: 6px;
    pointer-events: none;
  }
  .note, .rounds { margin: 4px 0 0; }
  .stat-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
  .stat-head h2 { margin: 0; font-size: 16px; }
  .stat-head .views { margin: 0; }
  table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
  th button { all: unset; cursor: pointer; }
  th[aria-sort="ascending"] button::after { content: " ▲"; }
  th[aria-sort="descending"] button::after { content: " ▼"; }
  tbody tr:hover { background: var(--row-hover); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.date { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .status { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: var(--ended-bg); color: var(--ended); white-space: nowrap; }
  .status.live { background: var(--live-bg); color: var(--live); }
  .sub { display: block; color: var(--muted); font-size: 12px; }
  .phone-only { display: none; }
  .empty, .error { padding: 32px 16px; text-align: center; color: var(--muted); }
  @media (max-width: 760px) {
    .phone-only { display: flex; }
    table, tbody, tr, td { display: block; border: 0; }
    table { background: transparent; }
    thead { display: none; }
    tbody tr {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 10px;
      padding: 6px 0;
    }
    td { display: flex; justify-content: space-between; gap: 12px; padding: 3px 12px; border: 0; text-align: right; }
    td.num { text-align: right; }
    td::before { content: attr(data-label); color: var(--muted); font-size: 12px; text-align: left; flex: none; }
    td.title { display: block; text-align: left; font-weight: 600; padding-top: 6px; }
    td.title::before { content: none; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>eaukcionai archyvas</h1>
    <p>Varžytynės ir aukcionai iš <a href="https://www.eaukcionai.lt">eaukcionai.lt</a>, išsaugoti ir pasibaigus. Viena eilutė yra vienas parduodamas objektas.</p>
  </header>

  <form id="filters" autocomplete="off">
    <label>Paieška pagal pavadinimą ar adresą
      <input type="search" name="q" placeholder="pvz. butas Šiauliai">
    </label>
    <details id="more" open>
    <summary>Filtrai</summary>
    <div class="grid">
    <label>Aukciono rūšis <select name="kind"></select></label>
    <label>Turto potipis <select name="subtype"></select></label>
    <label>Savivaldybė <select name="municipality"></select></label>
    <label>Vietovė <select name="settlement"></select></label>
    <label>Paskirtis <select name="paskirtis"></select></label>
    <label>Būsena <select name="status"></select></label>
    <label>Pradinė kaina, Eur
      <span class="pair"><input type="number" name="price_min" min="0" placeholder="nuo" inputmode="numeric"><input type="number" name="price_max" min="0" placeholder="iki" inputmode="numeric"></span>
    </label>
    <label>Pabaiga nuo <input type="date" name="end_from"></label>
    <label>Pabaiga iki <input type="date" name="end_to"></label>
    <label class="phone-only">Rikiuoti <select id="sort"></select></label>
    <button type="button" id="reset">Numatytieji filtrai</button>
    </div>
    </details>
  </form>

  <p class="summary">
    <span class="summary-main">
      <span id="count" aria-live="polite">Kraunama…</span>
      <label class="page-size">Puslapyje
        <select id="page-size">
          <option>50</option>
          <option selected>100</option>
          <option>200</option>
          <option>500</option>
        </select>
      </label>
    </span>
    <span id="updated"></span>
  </p>
  <div class="views" role="tablist" aria-label="Rodinys">
    <button type="button" id="view-list" role="tab" aria-selected="true">Sąrašas</button>
    <button type="button" id="view-stats" role="tab" aria-selected="false">Statistika</button>
  </div>
  <nav id="pager" class="pager" aria-label="Puslapiai" hidden></nav>
  <div id="results"></div>
  <nav id="pager-bottom" class="pager bottom" aria-label="Puslapiai" hidden></nav>
</div>

<script src="stats.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.14.2/sql-wasm.min.js" integrity="sha512-3rCfIirhW2xUpZCwDHnpKT5qyOvlt6hsu0Sq1IjP5hW9/k5YWnsLJ/7bF9KTmUgjDSQmvJw40mQDFbrxr647Ag==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
"use strict";
const SQL_JS_DIR = "https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.14.2/";
const LIVE_STATUSES = new Set(["Paskelbtas", "Paskelbtos", "Vykstančios", "Vykstantis"]);
const PAGE_SIZES = [50, 100, 200, 500];
const DEFAULT_PAGE_SIZE = 100;
const DEFAULT_WINDOW_DAYS = 90;

const COLUMNS = [
  { key: "name", label: "Turtas", sql: "name" },
  { key: "municipality", label: "Savivaldybė", sql: "municipality" },
  { key: "settlement", label: "Vietovė", sql: "settlement" },
  { key: "subtype", label: "Potipis", sql: "subtype" },
  { key: "paskirtis", label: "Paskirtis", sql: "paskirtis" },
  { key: "kind", label: "Rūšis", sql: "kind" },
  { key: "status", label: "Būsena", sql: "status" },
  { key: "starting_price_eur", label: "Pradinė kaina", sql: "starting_price_eur", format: "number" },
  { key: "highest_bid_eur", label: "Didžiausia kaina", sql: "highest_bid_eur", format: "number" },
  { key: "area_m2", label: "Plotas, m²", sql: "area_m2", format: "number" },
  { key: "price_per_m2", label: "Eur/m²", sql: "price_per_m2", format: "perM2" },
  { key: "first_seen", label: "Paskelbta", sql: "first_seen", format: "date" },
  { key: "end_date", label: "Pabaiga", sql: "end_date", format: "date" },
];
const SELECTS = ["kind", "subtype", "municipality", "settlement", "paskirtis", "status"];

const form = document.getElementById("filters");
const results = document.getElementById("results");
const countEl = document.getElementById("count");
const sortSelect = document.getElementById("sort");
const pageSizeSelect = document.getElementById("page-size");
const pagers = [document.getElementById("pager"), document.getElementById("pager-bottom")];
let db;
let sort = { key: "end_date", dir: "desc" };
let page = 1;
let pageSize = DEFAULT_PAGE_SIZE;
let view = "list";
let grain = "week";
let placeLevel = "municipality";
let itemCountByAuction;
const pct = new Intl.NumberFormat("lt-LT", { style: "percent", maximumFractionDigits: 1 });

const fold = (s) => (s ?? "").normalize("NFD").replace(/\p{M}/gu, "").toLocaleLowerCase("lt");
const eur = new Intl.NumberFormat("lt-LT", { maximumFractionDigits: 2 });
const perM2Small = new Intl.NumberFormat("lt-LT", { maximumSignificantDigits: 2 });
const FORMATS = {
  text: { text: (v) => v, firstDir: "asc", sqlOrder: false },
  number: { text: (v) => eur.format(v), className: "num", firstDir: "desc", sqlOrder: true },
  perM2: { text: (v) => formatPerM2(v), className: "num", firstDir: "desc", sqlOrder: true },
  date: { text: (v) => v.replace("T", " ").slice(0, 16), className: "date", firstDir: "desc", sqlOrder: true },
};
const formatOf = (column) => FORMATS[column.format ?? "text"];
for (const column of COLUMNS) {
  if (column.format && !FORMATS[column.format]) throw new Error(`unknown format ${column.format} on ${column.key}`);
}
const isoDate = (d) => d.toISOString().slice(0, 10);
const ITEM_WORD = { one: "objektas", few: "objektai" };
const plural = new Intl.PluralRules("lt");
const items = (n) => `${n} ${ITEM_WORD[plural.select(n)] ?? "objektų"}`;

function defaults() {
  const from = new Date();
  from.setDate(from.getDate() - DEFAULT_WINDOW_DAYS);
  return { end_from: isoDate(from) };
}

function readForm() {
  const values = Object.fromEntries(new FormData(form));
  for (const k of Object.keys(values)) if (values[k] === "") delete values[k];
  return values;
}

function writeForm(values) {
  for (const el of form.elements) if (el.name) el.value = values[el.name] ?? "";
}

function query(sqlText, params = []) {
  const stmt = db.prepare(sqlText);
  stmt.bind(params);
  const rows = [];
  while (stmt.step()) rows.push(stmt.getAsObject());
  stmt.free();
  return rows;
}

function fillSelects() {
  for (const name of SELECTS) {
    const select = form.elements[name];
    const values = name === "status"
      ? [...new Set(query("SELECT DISTINCT status AS v FROM item_rows WHERE status IS NOT NULL").map((r) => AuctionStats.statusGroup(r.v)))]
      : query(`SELECT DISTINCT ${name} AS v FROM item_rows WHERE ${name} IS NOT NULL`).map((r) => r.v);
    values.sort((a, b) => String(a).localeCompare(String(b), "lt"));
    select.replaceChildren(new Option("Visos", ""), ...values.map((v) => new Option(v, v)));
  }
}

function buildWhere(f, { dates = true } = {}) {
  const where = [];
  const params = [];
  if (f.q) {
    for (const word of fold(f.q).split(/\s+/).filter(Boolean)) {
      where.push("fold(name || ' ' || coalesce(address, '')) LIKE ?");
      params.push(`%${word}%`);
    }
  }
  for (const name of SELECTS) if (f[name]) {
    if (name === "status") {
      const raw = AuctionStats.statusesFor(f[name]);
      where.push(`status IN (${raw.map(() => "?").join(", ")})`);
      params.push(...raw);
    } else {
      where.push(`${name} = ?`);
      params.push(f[name]);
    }
  }
  if (f.price_min) { where.push("starting_price_eur >= ?"); params.push(Number(f.price_min)); }
  if (f.price_max) { where.push("starting_price_eur <= ?"); params.push(Number(f.price_max)); }
  if (dates && f.end_from) { where.push("end_date >= ?"); params.push(f.end_from); }
  if (dates && f.end_to) { where.push("end_date < ?"); params.push(`${f.end_to}T24`); }
  return { sql: where.length ? `WHERE ${where.join(" AND ")}` : "", params };
}

function formatPerM2(value) {
  if (value == null) return null;
  if (value !== 0 && Math.abs(value) < 0.005) return perM2Small.format(value);
  return eur.format(value);
}

function cell(tr, column, content, className) {
  const td = document.createElement("td");
  td.dataset.label = column.label;
  if (className) td.className = className;
  if (content instanceof Node) td.append(content); else td.textContent = content ?? "–";
  tr.append(td);
}

function renderRow(row) {
  const tr = document.createElement("tr");
  const title = document.createElement("span");
  const link = document.createElement("a");
  link.href = row.url;
  link.target = "_blank";
  link.rel = "noopener";
  link.textContent = row.name;
  const address = document.createElement("span");
  address.className = "sub";
  address.textContent = [row.address, row.number ? `Nr. ${row.number}` : null].filter(Boolean).join(" · ");
  title.append(link, address);
  const status = document.createElement("span");
  status.className = LIVE_STATUSES.has(row.status) ? "status live" : "status";
  status.textContent = AuctionStats.statusGroup(row.status);
  for (const column of COLUMNS) {
    const value = row[column.key];
    if (column.key === "name") cell(tr, column, title, "title");
    else if (column.key === "status") cell(tr, column, status);
    else {
      const format = formatOf(column);
      cell(tr, column, value == null ? null : format.text(value), format.className);
    }
  }
  return tr;
}

function renderHead() {
  const tr = document.createElement("tr");
  for (const column of COLUMNS) {
    const th = document.createElement("th");
    th.scope = "col";
    if (sort.key === column.key) th.setAttribute("aria-sort", sort.dir === "asc" ? "ascending" : "descending");
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = column.label;
    button.addEventListener("click", () => {
      sort = sort.key === column.key
        ? { key: column.key, dir: sort.dir === "asc" ? "desc" : "asc" }
        : { key: column.key, dir: formatOf(column).firstDir };
      page = 1;
      render();
    });
    th.append(button);
    tr.append(th);
  }
  const thead = document.createElement("thead");
  thead.append(tr);
  return thead;
}

function fillSortSelect() {
  sortSelect.replaceChildren(
    ...COLUMNS.flatMap((c) => [new Option(`${c.label} ↑`, `${c.key}.asc`), new Option(`${c.label} ↓`, `${c.key}.desc`)]),
  );
  sortSelect.addEventListener("change", (event) => {
    event.stopPropagation();
    const [key, dir] = sortSelect.value.split(".");
    sort = { key, dir };
    page = 1;
    render();
  });
}

function pageWindow(current, count) {
  const keep = new Set([1, count]);
  for (let n = current - 2; n <= current + 2; n++) keep.add(n);
  return [...keep].filter((n) => n >= 1 && n <= count).sort((a, b) => a - b);
}

function pageButton(text, target, { disabled = false, current = false, label }) {
  const button = document.createElement("button");
  button.type = "button";
  button.textContent = text;
  button.setAttribute("aria-label", label);
  if (current) button.setAttribute("aria-current", "page");
  button.disabled = disabled || current;
  if (!disabled && !current) button.addEventListener("click", () => goTo(target));
  return button;
}

function renderPagers(pageCount) {
  for (const nav of pagers) {
    nav.replaceChildren();
    nav.hidden = pageCount < 2;
    if (nav.hidden) continue;
    nav.append(pageButton("Ankstesnis", page - 1, { disabled: page === 1, label: "Ankstesnis puslapis" }));
    let previous = 0;
    for (const n of pageWindow(page, pageCount)) {
      if (n - previous > 1) {
        const gap = document.createElement("span");
        gap.className = "ellipsis";
        gap.textContent = "…";
        gap.setAttribute("aria-hidden", "true");
        nav.append(gap);
      }
      nav.append(pageButton(String(n), n, { current: n === page, label: `Puslapis ${n}` }));
      previous = n;
    }
    nav.append(pageButton("Kitas", page + 1, { disabled: page === pageCount, label: "Kitas puslapis" }));
  }
}

function goTo(next) {
  page = next;
  render();
  if (countEl.getBoundingClientRect().top < 0) countEl.scrollIntoView({ block: "start" });
}

function compareRows(a, b, column, dir) {
  const av = a[column.key];
  const bv = b[column.key];
  if (av == null && bv == null) return 0;
  if (av == null) return 1;
  if (bv == null) return -1;
  const primary = formatOf(column).className === "num" ? av - bv : String(av).localeCompare(String(bv), "lt");
  return dir === "desc" ? -primary : primary;
}

function writeHash(f) {
  const hash = { ...f, sort: `${sort.key}.${sort.dir}` };
  if (page > 1) hash.page = String(page);
  if (pageSize !== DEFAULT_PAGE_SIZE) hash.page_size = String(pageSize);
  if (view === "stats") hash.view = "stats";
  if (grain !== "week") hash.grain = grain;
  if (placeLevel !== "municipality") hash.place = placeLevel;
  history.replaceState(null, "", `#${new URLSearchParams(hash)}`);
}

function render() {
  sortSelect.value = `${sort.key}.${sort.dir}`;
  pageSizeSelect.value = String(pageSize);
  document.querySelector(".page-size").hidden = view === "stats";
  for (const [id, selected] of [["view-list", view === "list"], ["view-stats", view === "stats"]]) {
    document.getElementById(id).setAttribute("aria-selected", String(selected));
  }
  const f = readForm();
  writeHash(f);
  if (view === "stats") renderStats(f);
  else renderList(f);
}

function renderList(f) {
  const { sql: where, params } = buildWhere(f);
  const total = query(`SELECT count(*) AS n FROM item_rows ${where}`, params)[0].n;
  const pageCount = Math.max(1, Math.ceil(total / pageSize));
  if (page > pageCount) page = pageCount;
  if (page < 1) page = 1;
  const offset = (page - 1) * pageSize;
  const column = COLUMNS.find((c) => c.key === sort.key);
  // sql.js has no Lithuanian collation. Dates and numbers stay in SQL. Text sorts in the page.
  const sqlOrder = formatOf(column).sqlOrder;
  const direction = sort.dir === "asc" ? "ASC" : "DESC";
  let rows = query(
    `SELECT * FROM item_rows ${where}`
      + (sqlOrder
        ? ` ORDER BY ${column.sql} IS NULL, ${column.sql} ${direction}, auction_id, item_no LIMIT ? OFFSET ?`
        : ""),
    sqlOrder ? [...params, pageSize, offset] : params,
  );
  if (!sqlOrder) {
    rows.sort((a, b) => compareRows(a, b, column, sort.dir) || a.auction_id - b.auction_id || a.item_no - b.item_no);
    rows = rows.slice(offset, offset + pageSize);
  }
  const shownTo = offset + rows.length;
  countEl.textContent = page > 1 || shownTo < total ? `Rodoma ${offset + 1}–${shownTo} iš ${total}` : items(total);
  renderPagers(pageCount);
  if (!rows.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "Nieko nerasta. Pabandykite plačiau nustatyti filtrus.";
    results.replaceChildren(p);
    return;
  }
  const table = document.createElement("table");
  const tbody = document.createElement("tbody");
  tbody.append(...rows.map(renderRow));
  table.append(renderHead(), tbody);
  results.replaceChildren(table);
}

function itemCount(auctionId) {
  // Every item on the auction, including ones the filter hides, so a lot price is not treated as one sibling's price.
  if (!itemCountByAuction) {
    itemCountByAuction = new Map(
      query("SELECT auction_id, count(*) AS n FROM items GROUP BY auction_id").map((row) => [row.auction_id, row.n]),
    );
  }
  return itemCountByAuction.get(auctionId) ?? 1;
}

function inWindow(obs, f) {
  if (f.end_from && (!obs.endDay || obs.endDay < f.end_from)) return false;
  if (f.end_to && (!obs.endDay || obs.endDay > f.end_to)) return false;
  return true;
}

function loadObservations(f) {
  const { sql, params } = buildWhere(f, { dates: false });
  return query(
    "SELECT auction_id, status, type, end_date, municipality, settlement, subtype, share_sold, area_m2, starting_price_eur, highest_bid_eur"
      + ` FROM item_rows ${sql}`,
    params,
  ).map((row) => AuctionStats.observe(row, itemCount(row.auction_id)));
}

function money(value) {
  return value == null ? "–" : eur.format(value);
}

function rate(value) {
  return value == null ? "–" : pct.format(value);
}

function wonText(wonRate, won, decided) {
  return wonRate == null ? "–" : `${rate(wonRate)} (${won}/${decided})`;
}

const TIP = {

  cancelled: "Būsena Atšauktos, įskaitant Atšauktas.",
  starting: "Pradinės kainos mediana. Viena reikšmė vienam aukcionui.",

  place: "Savivaldybė arba vietovė, paimta iš adreso pradžios.",
  placeAuctions: "Visi laikotarpiai. Kiti filtrai galioja, pabaigos datos filtras ne.",
  placeLive: "Gyvi iš dabartinių filtrų, įskaitant pabaigos datą.",
  placeWon: "Įvykusių dalis iš visų laikų šioje vietoje. Datos filtras negalioja.",

  placeAskingM2: "Gyvų pradinės Eur/m² mediana iš dabartinių filtrų.",
  gap: "Skelbiama Eur/m², padalinta iš pasiektos, minus 1. Neigiama reiškia pigiau už įvykusius.",
  rounds: "Gyvų aukcionų skaičius pagal tipą, pavyzdžiui Pirmosios ar Pakartotinis.",
};

const tip = document.createElement("div");
tip.className = "tip";
tip.id = "metric-tip";
tip.setAttribute("role", "tooltip");
tip.hidden = true;
document.body.append(tip);
let tipTarget = null;
document.addEventListener("click", (event) => {
  if (tipTarget && !tipTarget.contains(event.target)) hideTip();
});

function hideTip() {
  tip.hidden = true;
  if (tipTarget) tipTarget.removeAttribute("aria-describedby");
  tipTarget = null;
}

function showTip(el, text) {
  if (tipTarget && tipTarget !== el) tipTarget.removeAttribute("aria-describedby");
  tipTarget = el;
  el.setAttribute("aria-describedby", tip.id);
  tip.hidden = false;
  tip.textContent = text;
  const rect = el.getBoundingClientRect();
  const width = Math.min(280, window.innerWidth - 16);
  tip.style.maxWidth = `${width}px`;
  tip.style.left = `${Math.max(8, Math.min(rect.left, window.innerWidth - width - 8))}px`;
  tip.style.top = "0px";
  const below = rect.bottom + 6;
  const top = below + tip.offsetHeight > window.innerHeight - 8 ? rect.top - tip.offsetHeight - 6 : below;
  tip.style.top = `${Math.max(8, top)}px`;
}

function bindTip(el, text, { focusable = true } = {}) {
  if (focusable) {
    el.classList.add("metric");
    el.tabIndex = 0;
  }
  el.addEventListener("pointerenter", (event) => {
    if (event.pointerType !== "touch") showTip(el, text);
  });
  el.addEventListener("pointerleave", (event) => {
    if (event.pointerType !== "touch") hideTip();
  });
  el.addEventListener("focus", () => showTip(el, text));
  el.addEventListener("blur", hideTip);
  el.addEventListener("click", (event) => {
    event.stopPropagation();
    if (tip.hidden || tipTarget !== el) showTip(el, text);
    else hideTip();
  });
}

function card(value, label, definition) {
  const div = document.createElement("div");
  div.className = "card";
  const strong = document.createElement("b");
  strong.textContent = value;
  const span = document.createElement("span");
  span.textContent = label;
  bindTip(span, definition);
  div.append(strong, span);
  return div;
}

function choice(options, current, onPick) {
  const span = document.createElement("span");
  span.className = "views";
  for (const [id, label] of options) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = label;
    button.setAttribute("aria-pressed", String(id === current));
    button.addEventListener("click", () => onPick(id));
    span.append(button);
  }
  return span;
}

function statsTable(headers, rows) {
  const table = document.createElement("table");
  const head = document.createElement("tr");
  for (const header of headers) {
    const th = document.createElement("th");
    bindTip(th, header.tip);
    th.textContent = header.label;
    head.append(th);
  }
  const thead = document.createElement("thead");
  thead.append(head);
  const tbody = document.createElement("tbody");
  if (!rows.length) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = headers.length;
    td.textContent = "Nėra duomenų.";
    tr.append(td);
    tbody.append(tr);
  }
  for (const cells of rows) {
    const tr = document.createElement("tr");
    cells.forEach((value, index) => {
      const td = document.createElement("td");
      const header = headers[index];
      td.dataset.label = header.label;
      bindTip(td, header.tip, { focusable: false });
      if (index > 0) td.className = "num";
      td.textContent = value ?? "–";
      tr.append(td);
    });
    tbody.append(tr);
  }
  table.append(thead, tbody);
  return table;
}

function section(title, note, controls, table) {
  const wrap = document.createElement("section");
  const head = document.createElement("div");
  head.className = "stat-head";
  const heading = document.createElement("h2");
  heading.textContent = title;
  head.append(heading, controls);
  const caption = document.createElement("p");
  caption.className = "note";
  caption.textContent = note;
  wrap.append(head, caption, table);
  return wrap;
}

function col(label, tipText) {
  return { label, tip: tipText };
}

function renderStats(f) {
  hideTip();
  for (const nav of pagers) nav.hidden = true;
  const market = loadObservations(f);
  const current = market.filter((obs) => inWindow(obs, f));
  const asOf = (query("SELECT max(last_fetched) AS t FROM auctions")[0].t || "").slice(0, 10);
  const summary = AuctionStats.summarize(current, asOf);
  const showM2 = Boolean(f.subtype);
  countEl.textContent = items(summary.items);
  const root = document.createElement("div");
  root.className = "stats";

  const cards = document.createElement("div");
  cards.className = "cards";
  cards.append(
    card(String(summary.items), "Objektai", TIP.items),
    card(String(summary.auctions), "Aukcionai", TIP.auctions),
    card(String(summary.live), "Gyvi", TIP.live),
    card(wonText(summary.wonRate, summary.won, summary.decided), "Įvykusių dalis", TIP.wonRate),
    card(String(summary.cancelled), "Atšaukta", TIP.cancelled),
    card(money(summary.startingMedian), "Pradinė kaina, mediana", TIP.starting),
    card(money(summary.achievedMedian), "Pasiekta kaina, mediana", TIP.achieved),
    card(summary.premiumMedian == null ? "–" : rate(summary.premiumMedian - 1), "Antkainis, mediana", TIP.premium),
    card(rate(summary.soldAtStart), "Parduota už pradinę", TIP.atStart),
    card(String(summary.endingWithin7Days), "Baigiasi per 7 dienas", TIP.soon),
  );
  root.append(cards);

  const m2Headers = [col("Potipis", TIP.subtype), col("Pradinė, Eur/m²", TIP.askingM2), col("Pasiekta, Eur/m²", TIP.achievedM2)];
  const m2Rows = summary.eurM2.map((row) => [row.subtype, formatPerM2(row.askingMedian), formatPerM2(row.achievedMedian)]);
  root.append(section(
    "Eur/m²",
    "Vienas objektas, parduodamas visas. Pasiekta kaina tik įvykusiems.",
    document.createElement("span"),
    statsTable(m2Headers, m2Rows),
  ));

  if (summary.rounds.length) {
    const rounds = document.createElement("p");
    rounds.className = "rounds";
    const roundsLabel = document.createElement("span");
    roundsLabel.textContent = "Gyvi pagal etapą.";
    bindTip(roundsLabel, TIP.rounds);
    rounds.append(roundsLabel, ` ${summary.rounds.map((round) => `${round.type} ${round.n}`).join(", ")}.`);
    root.append(rounds);
  }

  const timeHeaders = [
    col("Laikotarpis", TIP.period),
    col("Aukcionai", TIP.timeAuctions),
    col("Įvyko", TIP.wonRate),
    col("Pradinė", TIP.starting),
    col("Pasiekta", TIP.achieved),
    col("Antkainis", TIP.premium),
  ];
  if (showM2) timeHeaders.push(col("Pradinė, Eur/m²", TIP.askingM2), col("Pasiekta, Eur/m²", TIP.achievedM2));
  const timeRows = AuctionStats.byTime(current, grain).map((row) => {
    const cells = [
      row.period,
      String(row.auctions),
      wonText(row.wonRate, row.won, row.decided),
      money(row.startingMedian),
      money(row.achievedMedian),
      row.premiumMedian == null ? "–" : rate(row.premiumMedian - 1),
    ];
    if (showM2) cells.push(formatPerM2(row.askingMedian), formatPerM2(row.achievedM2Median));
    return cells;
  });
  root.append(section(
    "Pagal laiką",
    "Pagal pabaigos datą, su tais pačiais filtrais. Eur/m² atsiranda pasirinkus potipį.",
    choice([["day", "Diena"], ["week", "Savaitė"], ["month", "Mėnuo"]], grain, (next) => {
      grain = next;
      render();
    }),
    statsTable(timeHeaders, timeRows),
  ));

  const placeHeaders = [
    col("Vieta", TIP.place),
    col("Aukcionai", TIP.placeAuctions),
    col("Gyvi", TIP.placeLive),
    col("Įvyko", TIP.placeWon),
  ];
  if (showM2) {
    placeHeaders.push(
      col("Pasiekta, Eur/m²", TIP.placeAchievedM2),
      col("Skelbiama, Eur/m²", TIP.placeAskingM2),
      col("Skirtumas", TIP.gap),
    );
  }
  const placeRows = AuctionStats.byPlace(market, current, placeLevel, showM2).map((row) => {
    const cells = [row.place, String(row.auctions), String(row.live), wonText(row.wonRate, row.won, row.decided)];
    if (showM2) cells.push(formatPerM2(row.achievedMedian), formatPerM2(row.liveAskingMedian), rate(row.gap));
    return cells;
  });
  root.append(section(
    "Pagal vietą",
    "Įvykusių dalis ir pasiekta kaina yra iš visų laikų. Gyvi ir skelbiama kaina yra iš dabartinių filtrų. Pigiausios vietos viršuje, kai pasirinktas potipis.",
    choice([["municipality", "Savivaldybė"], ["settlement", "Vietovė"]], placeLevel, (next) => {
      placeLevel = next;
      render();
    }),
    statsTable(placeHeaders, placeRows),
  ));
  results.replaceChildren(root);
}

function restoreFromHash() {
  const params = Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
  if (params.sort) {
    const [key, dir] = params.sort.split(".");
    if (COLUMNS.some((c) => c.key === key) && (dir === "asc" || dir === "desc")) sort = { key, dir };
    delete params.sort;
  }
  const requestedPage = Number(params.page);
  if (Number.isInteger(requestedPage) && requestedPage >= 1) page = requestedPage;
  delete params.page;
  const requestedSize = Number(params.page_size);
  if (PAGE_SIZES.includes(requestedSize)) pageSize = requestedSize;
  delete params.page_size;
  if (params.view === "stats") view = "stats";
  delete params.view;
  if (params.grain === "day" || params.grain === "week" || params.grain === "month") grain = params.grain;
  delete params.grain;
  if (params.place === "municipality" || params.place === "settlement") placeLevel = params.place;
  delete params.place;
  if (params.status) params.status = AuctionStats.statusGroup(params.status);
  writeForm(Object.keys(params).length ? params : defaults());
}

async function main() {
  try {
    const [SQL, buffer] = await Promise.all([
      initSqlJs({ locateFile: (file) => SQL_JS_DIR + file }),
      fetch("auctions.sqlite").then((r) => {
        if (!r.ok) throw new Error(`auctions.sqlite: HTTP ${r.status}`);
        return r.arrayBuffer();
      }),
    ]);
    db = new SQL.Database(new Uint8Array(buffer));
    db.create_function("fold", fold);
    fillSelects();
    fillSortSelect();
    restoreFromHash();
    const latest = query("SELECT max(last_fetched) AS t FROM auctions")[0].t;
    if (latest) document.getElementById("updated").textContent = `Atnaujinta ${latest.replace("T", " ").replace("Z", " UTC")}`;
    render();
  } catch (error) {
    countEl.textContent = "";
    for (const nav of pagers) nav.hidden = true;
    results.innerHTML = "";
    const p = document.createElement("p");
    p.className = "error";
    p.textContent = `Nepavyko įkelti duomenų: ${error.message}`;
    results.append(p);
  }
}

let debounce;
form.addEventListener("input", () => {
  clearTimeout(debounce);
  debounce = setTimeout(() => { page = 1; if (db) render(); }, 150);
});
pageSizeSelect.addEventListener("change", () => {
  pageSize = Number(pageSizeSelect.value);
  page = 1;
  if (db) render();
});
document.getElementById("reset").addEventListener("click", () => {
  writeForm(defaults());
  sort = { key: "end_date", dir: "desc" };
  page = 1;
  grain = "week";
  placeLevel = "municipality";
  render();
});
document.getElementById("view-list").addEventListener("click", () => {
  view = "list";
  if (db) render();
});
document.getElementById("view-stats").addEventListener("click", () => {
  view = "stats";
  if (db) render();
});
if (matchMedia("(max-width: 760px)").matches) document.getElementById("more").open = false;
main();
</script>
