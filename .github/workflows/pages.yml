name: pages

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "src/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # main, not the triggering commit: the nightly caller has just pushed new data on top of it.
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Build site/auctions.sqlite
        run: uv run --locked python -m eaukcionai.build_site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
