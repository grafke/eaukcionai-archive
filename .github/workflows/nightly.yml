name: nightly

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-data
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Scrape eaukcionai.lt
        run: uv run --locked python -m eaukcionai.run
      # Runs after a scrape that exited 1 too: it wrote data for every auction that parsed.
      # The job still fails, so GitHub sends the failure email.
      - name: Commit data
        if: ${{ always() }}
        run: |
          [ -d data ] || exit 0
          git add data
          if git diff --cached --quiet; then
            echo "data unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: nightly snapshot $(date -u +%F)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

  # Pushes made with GITHUB_TOKEN do not trigger other workflows, so deploy from here.
  pages:
    needs: scrape
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
